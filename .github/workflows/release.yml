# Release — builds, signs, and publishes on every version tag.
#
# Only the build step is language-specific. Packaging, checksums, Sigstore
# attestation, and the release upload are the shared
# branchkit/registry/release-action, identical for every plugin.
#
# The plugin is pure Go, so every target cross-compiles with cgo off. The
# Windows targets package on a Windows runner: branchkit-cli names the
# program inside the archive by the packaging host's executable suffix, so a
# Windows archive packaged on Linux would carry `badges-plugin` without the
# `.exe` Windows runs. The binary is built beside plugin.json, where `run`
# names it, so the packager finds the `.exe` there.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write      # upload release assets
      id-token: write      # OIDC for keyless signing
      attestations: write  # record the attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: ubuntu-latest }
          - { goos: darwin, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-latest }
          - { goos: windows, goarch: amd64, runner: windows-latest, exe: .exe }
          - { goos: windows, goarch: arm64, runner: windows-latest, exe: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -C src -o ../badges-plugin${{ matrix.exe }} .

      - name: Package, sign, release
        uses: branchkit/registry/release-action@main
        with:
          binary: badges-plugin${{ matrix.exe }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          tag: ${{ github.ref_name }}
          # Pinned, so a release packages with a known CLI rather than
          # whatever `latest` is that day; v0.1.0 is the first that packages
          # a Windows `.exe` under its own name. Move it forward deliberately.
          cli-version: v0.1.0
